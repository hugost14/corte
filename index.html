<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corte</title>
<meta name="description" content="Editor de video UGC para TikTok Shop. Funciona sin internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corte">
<meta name="theme-color" content="#111215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
.offl{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));z-index:25;background:#25282f;color:#ecebe6;border:1px solid #31353d;font:600 12px "Bricolage Grotesque",-apple-system,system-ui,sans-serif;padding:7px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<style>
/* Layout: one-screen dark editing bay — preview on top, center-playhead timeline like a film splicer, tool dock at the bottom */
:root{
  --bg:#111215; --panel:#191b20; --raise:#25282f; --line:#31353d; --fg:#ecebe6; --dim:#9a9ca4;
  --accent:#f2b544; --accent-ink:#1d1505; --text-track:#4fc2b8; --music-track:#a593f4; --danger:#ff6b5e; --mark:rgba(255,107,94,.55); --ov-track:#e57fa6;
  --ui:"Bricolage Grotesque", -apple-system, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;gap:8px;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:auto;min-width:0}
.brand b{font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.dur{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.btn.icon{padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.auto{border-color:var(--accent);color:var(--accent);padding:0 10px;white-space:nowrap;flex:none}
.card{max-height:100%;overflow-y:auto}
.card input[type=text]{width:100%;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:600 15px var(--ui);-webkit-user-select:text;user-select:text}
.warn-note{color:var(--accent)}
.panel input[type=text]{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:600 14px var(--ui);-webkit-user-select:text;user-select:text}
.thumb{width:36px;height:48px;border-radius:6px;background:var(--raise) center/cover;flex:none;display:block}
.blk.s{top:15px;height:7px;padding:0;background:var(--text-track);opacity:.4;pointer-events:none;border-radius:2px}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding-block:4px}
#cv{display:block;border-radius:6px;background:#000;box-shadow:0 0 0 1px var(--line);touch-action:none}
#cv.pan{cursor:grab;box-shadow:0 0 0 2px var(--accent)}
.empty{position:absolute;inset:4px 0;display:grid;place-items:center}
.empty-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px;max-width:280px}
.empty-card h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.empty-card p{margin:0;color:var(--dim);font-size:13px;line-height:1.45}
.empty-card .btn{height:44px;padding:0 20px;font-size:15px}

.transport{display:flex;align-items:center;gap:8px;padding-block:6px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.tc{font-family:var(--mono);font-size:12px;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap}
.tc span{color:var(--dim)}

.tlwrap{position:relative;height:166px;border-radius:10px;background:var(--panel);overflow:hidden;flex:none}
.tl{height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.tl::-webkit-scrollbar{display:none}
.inner{position:relative;height:100%}
.ruler{position:relative;height:20px;background-repeat:repeat-x}
.ruler span{position:absolute;top:4px;font-family:var(--mono);font-size:9px;color:var(--dim);transform:translateX(-50%)}
.track{position:relative;margin-top:6px}
.tv{height:56px}.to,.tt,.tm{height:22px}
.clip{position:absolute;top:0;height:100%;border-radius:6px;border:2px solid transparent;background-color:var(--raise);background-size:auto 100%;background-repeat:repeat-x;padding:0;overflow:hidden}
.clip.sel{border-color:var(--accent)}
.clip.mir{background-position:right;}
.clip-tag{position:absolute;left:4px;bottom:3px;font-family:var(--mono);font-size:9px;background:rgba(0,0,0,.65);color:#fff;padding:1px 4px;border-radius:3px;white-space:nowrap}
.kfd{position:absolute;top:4px;width:9px;height:9px;margin-left:-4.5px;background:var(--accent);transform:rotate(45deg);border:1px solid #000;pointer-events:none}
.mk{position:absolute;top:0;height:100%;background:var(--mark);border-left:1px solid var(--danger);border-right:1px solid var(--danger);pointer-events:none;z-index:1}
.blk{position:absolute;top:0;height:100%;border-radius:5px;border:0;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;text-align:left;color:#0f1112}
.blk.t{background:var(--text-track)}
.blk.m{background:var(--music-track)}
.blk.o{background-color:var(--ov-track);background-size:auto 100%;background-repeat:repeat-x;color:#fff;text-shadow:0 1px 2px #000}
.blk.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.hint{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:0 0 5px 5px;background:var(--fg)}
.zoom{position:absolute;right:6px;top:2px;display:flex;gap:4px;z-index:4}
.zoom button{width:24px;height:18px;border-radius:5px;border:1px solid var(--line);background:var(--raise);font-family:var(--mono);font-size:12px;line-height:1;padding:0}

.panel{flex:none;max-height:min(230px,36vh);overflow-y:auto;margin-top:8px;border-radius:12px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec+.sec{padding-top:12px;border-top:1px solid var(--line)}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.warn{color:var(--danger)}
.chip.go{border-color:var(--accent);color:var(--accent)}
.chip.mkc{font-family:var(--mono);font-size:11px;border-color:var(--danger)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.field{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.field output{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;resize:none;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 15px var(--ui);-webkit-user-select:text;user-select:text}
.note{font-size:12px;color:var(--dim);line-height:1.45;margin:0}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pre{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11px;color:var(--dim)}
.pre i{width:48px;height:64px;border-radius:7px;background:var(--raise) center/cover;border:2px solid transparent;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.pre.on{color:var(--fg)}.pre.on i{border-color:var(--accent)}

.dock{flex:none;display:grid;grid-template-columns:repeat(7,1fr);padding-block:6px 4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--dim);padding:6px 0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

.modal{position:fixed;inset:0;background:rgba(5,6,8,.78);display:grid;place-items:center;z-index:20;padding:16px}
.card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:19px;font-weight:800}
.bar{height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.card video{width:100%;max-height:46vh;border-radius:8px;background:#000}
.card .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);text-align:center}
#vhost{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}
#vhost video,#vhost audio{width:2px;height:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Corte<i>.</i></b><span class="dur" id="durLbl">sin clips</span></div>
    <button class="btn icon" id="undoBtn" aria-label="Deshacer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn icon" id="addBtn" aria-label="Agregar clips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn primary" id="exportBtn" disabled>Exportar</button>
  </header>

  <section class="stage" id="stage">
    <canvas id="cv" width="720" height="1280"></canvas>
    <div class="empty" id="empty">
      <div class="empty-card">
        <h1>Arma tu video aquí mismo</h1>
        <p>Importa uno o varios clips de tu carrete. Limpia el audio, quita silencios, agrega zooms y textos, y exporta en MP4.</p>
        <button class="btn primary" id="importBtn">Importar clips</button>
      </div>
    </div>
  </section>

  <div class="transport">
    <button class="play" id="playBtn" aria-label="Reproducir"><svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <div class="tc" id="tc">00:00:00 <span>/ 00:00:00</span></div>
    <button class="btn auto" id="autoBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Auto UGC</button>
    <button class="btn icon" id="splitBtn" aria-label="Dividir en el cabezal" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></button>
  </div>

  <div class="tlwrap">
    <div class="tl" id="tl">
      <div class="inner" id="inner">
        <div class="ruler" id="ruler"></div>
        <div class="track tv" id="trV"></div>
        <div class="track to" id="trO"></div>
        <div class="track tt" id="trT"></div>
        <div class="track tm" id="trM"></div>
      </div>
    </div>
    <div class="hint" id="tlHint">Tus clips aparecerán aquí</div>
    <div class="playhead"></div>
    <div class="zoom"><button id="zOut" aria-label="Alejar línea de tiempo">−</button><button id="zIn" aria-label="Acercar línea de tiempo">+</button></div>
  </div>

  <div class="panel" id="panel" hidden></div>

  <nav class="dock" id="dock">
    <button class="tab" data-tab="editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>Editar</button>
    <button class="tab" data-tab="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>Audio</button>
    <button class="tab" data-tab="capas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" fill="currentColor" fill-opacity=".25"/></svg>Capas</button>
    <button class="tab" data-tab="texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texto</button>
    <button class="tab" data-tab="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5M10.5 7.5v6M7.5 10.5h6"/></svg>Zoom</button>
    <button class="tab" data-tab="filtros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg>Filtros</button>
    <button class="tab" data-tab="formato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M2.5 7v10M21.5 7v10"/></svg>Formato</button>
  </nav>
</div>

<input type="file" id="fileV" accept="video/*" multiple hidden>
<input type="file" id="fileA" accept="audio/*,video/*" hidden>
<input type="file" id="fileOI" accept="image/*" hidden>
<input type="file" id="fileOV" accept="video/*" hidden>
<input type="file" id="fileAI" accept="image/*" multiple hidden>
<div id="vhost"></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d'), tl=$('#tl'), inner=$('#inner'), panel=$('#panel');
const AR={'9:16':[9,16],'4:5':[4,5],'1:1':[1,1],'16:9':[16,9]};
const FONTS={block:['400','"Archivo Black", Impact, sans-serif'],grot:['800','"Bricolage Grotesque", -apple-system, sans-serif'],clasica:['700','"Helvetica Neue", Helvetica, Arial, sans-serif']};
const COLORS=['#ffffff','#111111','#f2b544','#ff4d4d','#2fd27a','#ff7ad9','#4fa3ff'];
const SPEEDS=[0.5,0.75,1,1.25,1.5,2,3];
const FILTERS=[
  {name:'Original',b:100,c:100,s:100,p:0,h:0},
  {name:'Limpio',b:106,c:108,s:112,p:0,h:0},
  {name:'Vívido',b:102,c:112,s:140,p:0,h:0},
  {name:'Cálido',b:104,c:104,s:110,p:22,h:0},
  {name:'Frío',b:103,c:102,s:92,p:0,h:12},
  {name:'Mate',b:108,c:84,s:85,p:8,h:0},
  {name:'B y N',b:102,c:118,s:0,p:0,h:0}
];
const TEXT_PRESETS={
  gancho:{text:'Esto cambió mi rutina',style:'caja',color:'#ffffff',font:'block',size:7.5,y:20,anim:'pop'},
  sub:{text:'Escribe tu subtítulo',style:'contorno',color:'#ffffff',font:'grot',size:6,y:72,anim:'none'},
  cta:{text:'Cómpralo en el carrito naranja',style:'caja',color:'#f2b544',font:'block',size:5.8,y:84,anim:'pop'}
};
const NOISE={off:{hp:20,lp:20000,g:0},bajo:{hp:70,lp:12000,g:.5},medio:{hp:90,lp:9500,g:.75},alto:{hp:115,lp:8000,g:.95}};
const SENS={suave:{k:.18,min:.7,pad:.14},normal:{k:.26,min:.45,pad:.1},agresivo:{k:.34,min:.3,pad:.07}};

const S={clips:[],texts:[],marks:[],overlays:[],subs:{mode:'script',fix:{},script:'',words:[],style:'karaoke',y:64,size:7,hl:'#f2b544',max:3,offset:0,caps:false,hash:''},filt:{...FILTERS[0]},fit:'cover',bg:'#000000',aspect:'9:16',res:720,origVol:1,musicVol:0.6,musicOffset:0,noise:'off',voice:false,sens:'normal'};
const sources={}, imgs={}; let music=null, selOv=null;
let pps=60, curT=0, playing=false, activeIdx=-1, selClip=-1, selText=null, tab=null, exporting=false, busy=false;
let hist=[], actx=null, A={}, recDest=null, dlNS=null, lastProg=-1, wake=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

(async()=>{try{dlNS=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dlNS=null}})();
try{document.fonts.load('40px "Archivo Black"');document.fonts.load('800 40px "Bricolage Grotesque"')}catch(e){}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}

/* ---------- time helpers ---------- */
const cDur=c=>(c.out-c.in)/c.speed;
const total=()=>S.clips.reduce((a,c)=>a+cDur(c),0);
function cStart(i){let t=0;for(let k=0;k<i;k++)t+=cDur(S.clips[k]);return t}
function locate(t){let st=0;for(let i=0;i<S.clips.length;i++){const c=S.clips[i],d=cDur(c);if(t<st+d||i===S.clips.length-1&&t<=st+d+1e-6){const l=cl(t-st,0,d);return{i,st,src:c.in+l*c.speed}}st+=d}return null}
function srcToT(src,a){for(let i=0;i<S.clips.length;i++){const c=S.clips[i];if(c.src===src&&a>=c.in-0.05&&a<c.out)return cStart(i)+Math.max(0,a-c.in)/c.speed}return -1}
function tc(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),f=Math.floor((t%1)*30);return[m,s,f].map(n=>String(n).padStart(2,'0')).join(':')}
const short=t=>t<10?t.toFixed(1)+'s':Math.round(t)+'s';
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const newClip=(src,a,b)=>({id:uid(),src,in:a,out:b,speed:1,mute:false,mirror:false,kf:[]});
const cloneClip=c=>({...c,id:uid(),kf:(c.kf||[]).map(k=>({...k}))});

/* ---------- history ---------- */
const SNAP_KEYS=['clips','texts','marks','overlays','subs','filt','fit','bg','aspect','res','origVol','musicVol','musicOffset','noise','voice','sens'];
function snap(){const o={};SNAP_KEYS.forEach(k=>o[k]=S[k]);return JSON.stringify(o)}
function push(){hist.push(snap());if(hist.length>60)hist.shift();$('#undoBtn').disabled=false}

/* ---------- audio graph: clips → limpieza → voz → limitador ---------- */
const GATE_SRC=`class G extends AudioWorkletProcessor{

process(I,O,P){const i=I[0],o=O[0];if(!i||!i.length)return true;const a=P.amount[0],n=i[0].length,sr=sampleRate;

for(let s=0;s<n;s++){let m=0;for(let c=0;c<i.length;c++){const x=Math.abs(i[c][s]);if(x>m)m=x}
this.env+=(m>this.env?at:rl)*(m-this.env);
if(this.env<this.fl)this.fl+=(this.env-this.fl)*0.01;else this.fl+=(this.env-this.fl)*fu;

for(let c=0;c<o.length;c++){const src=i[c]||i[0];o[c][s]=src[s]*this.g}}

registerProcessor('gate-corte',G);`;
function ensureAudio(){

    const bq=(type,f,q,g)=>{const n=actx.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!=null)n.Q.value=q;if(g!=null)n.gain.value=g;return n};

    A.mud=bq('peaking',260,1,0);A.pres=bq('peaking',3200,0.9,0);A.air=bq('highshelf',9000,null,0);

    A.lim=actx.createDynamicsCompressor();A.lim.threshold.value=-2;A.lim.knee.value=0;A.lim.ratio.value=20;A.lim.attack.value=0.002;A.lim.release.value=0.12;

    if(actx.audioWorklet&&window.AudioWorkletNode){

      actx.audioWorklet.addModule(url).then(()=>{A.gate=new AudioWorkletNode(actx,'gate-corte',{outputChannelCount:[2]});A.hp.disconnect();A.hp.connect(A.gate);A.gate.connect(A.lp);applyAudio()}).catch(()=>{});

function applyAudio(){

  A.mud.gain.setTargetAtTime(v?-3.5:0,t,.02);A.pres.gain.setTargetAtTime(v?4.5:0,t,.02);A.air.gain.setTargetAtTime(v?2.5:0,t,.02);

/* ---------- análisis de audio: silencios y muletillas ---------- */
async function analyze(s){
  if(s.an)return s.an;

  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;

  const D=Math.max(1,Math.round(sr/8000)),dsr=sr/D,ds=new Float32Array(Math.ceil(ab.length/D)+2);
  for(let f=0;f<frames;f++){let sum=0,bs=0,z=0,prev=0;const o=f*hop;for(let j=0;j<hop;j++){const v=d1?(d0[o+j]+d1[o+j])*0.5:d0[o+j];sum+=v*v;if((v>=0)!==(prev>=0))z++;prev=v;
      const h=H[0]*v+H[1]*hx1+H[2]*hx2-H[3]*hy1-H[4]*hy2;hx2=hx1;hx1=v;hy2=hy1;hy1=h;
      const l=Lp[0]*h+Lp[1]*lx1+Lp[2]*lx2-Lp[3]*ly1-Lp[4]*ly2;lx2=lx1;lx1=h;ly2=ly1;ly1=l;bs+=l*l;
      if((o+j)%D===0)ds[((o+j)/D)|0]=l}

    let e0=0;for(let i=0;i<W;i++)e0+=ds[c+i]*ds[c+i];if(e0<1e-9)continue;
    let eL=0;for(let i=0;i<W;i++){const x=ds[c+lmin+i];eL+=x*x}
    let best=0;for(let lag=lmin;lag<=lmax;lag++){if(lag>lmin){const a=ds[c+lag-1],b=ds[c+lag-1+W];eL+=b*b-a*a}
      let r=0;for(let i=0;i<W;i++)r+=ds[c+i]*ds[c+i+lag];const nr=r/Math.sqrt(e0*Math.max(eL,1e-12));if(nr>best)best=nr}
    vo[f]=best}

}
function pct(arr,p){const a=Float32Array.from(arr).sort();return a[Math.floor((a.length-1)*p)]}
function thresh(an,mode){const lo=pct(an.rms,.1),hi=pct(an.rms,.95);return lo+(hi-lo)*SENS[mode].k}
/* Detecta voz por tono (periodicidad) + nivel sobre el ruido de fondo del clip; devuelve todo lo que NO es voz para cortarlo */
const VAD={suave:{m:4,v:.45,gap:.45,pre:.16,post:.24,minV:6},normal:{m:6,v:.52,gap:.3,pre:.1,post:.16,minV:9},agresivo:{m:6,v:.53,gap:.2,pre:.06,post:.11,minV:10}};
function silences(an,mode){
  const p=VAD[mode],hop=an.hop,n=an.frames;
  const quiet=[];for(let f=0;f<n;f++)if(an.vo[f]<0.35)quiet.push(an.sp[f]);
  const noise=pct(quiet.length>30?quiet:an.sp,0.5),th=noise+p.m;
  const segs=[];let st=-1,last=-1,cnt=0;
  for(let f=0;f<n;f++){if(an.vo[f]>=p.v&&an.sp[f]>=th){
      if(st>=0&&(f-last)*hop<p.gap){last=f;cnt++}
      else{if(st>=0)segs.push([st,last,cnt]);st=f;last=f;cnt=1}}}
  if(st>=0)segs.push([st,last,cnt]);
  const speech=segs.filter(s=>s[2]>=p.minV).map(s=>{
    let a=s[0],b=s[1];const ext=Math.round(0.15/hop);
    for(let k=0;k<ext&&a>0&&an.sp[a-1]>=th;k++)a--;
    for(let k=0;k<ext&&b<n-1&&an.sp[b+1]>=th;k++)b++;
    return[Math.max(0,a*hop-p.pre),(b+1)*hop+p.post]});
  if(!speech.length)return null;
  const cuts=[];let cur=0;speech.forEach(s=>{if(s[0]>cur+0.05)cuts.push([cur,s[0]]);cur=Math.max(cur,s[1])});cuts.push([cur,1e9]);
  return cuts;
}
function fillers(an,mode){
  const th=thresh(an,mode),segs=[];let st=-1,gap=0;
  for(let f=0;f<=an.frames;f++){const voiced=f<an.frames&&an.rms[f]>=th;
    if(voiced){if(st<0)st=f;gap=0}else if(st>=0){gap++;if(gap>=12||f===an.frames){segs.push([st,f-gap+1]);st=-1;gap=0}}}
  const out=[];
  segs.forEach(([a,b])=>{const len=(b-a)*an.hop;if(len<0.18||len>1.1)return;
    let mr=0,mz=0;const amp=[];for(let f=a;f<b;f++){const x=Math.pow(10,an.rms[f]/20);amp.push(x);mr+=x;mz+=an.zcr[f]}
    const n=b-a;mr/=n;mz/=n;let vr=0,vz=0;for(let f=a;f<b;f++){vr+=Math.pow(amp[f-a]-mr,2);vz+=Math.pow(an.zcr[f]-mz,2)}

    if(cvr<0.45&&cvz<0.32&&mz<0.09)out.push([Math.max(0,a*an.hop-0.04),b*an.hop+0.04]);
  });

}
function cutRanges(map){
  const out=[];
  S.clips.forEach(c=>{const rs=(map[c.src]||[]).filter(r=>r[1]>c.in&&r[0]<c.out).sort((x,y)=>x[0]-y[0]);let cur=c.in,pc=0;
    const add=(a,b)=>{const n=cloneClip(c);n.in=a;n.out=b;if(pc++)n.tr='none';out.push(n)};
    rs.forEach(([a,b])=>{a=Math.max(a,c.in);b=Math.min(b,c.out);if(a-cur>=0.08)add(cur,a);cur=Math.max(cur,b)});
    if(c.out-cur>=0.08)add(cur,c.out)});

async function autoCut(kind){
  stop();if(!S.clips.length||busy)return;busy=true;
  modal(`<h2>${kind==='sil'?'Buscando partes sin voz…':'Buscando muletillas…'}</h2><p class="note">Estoy leyendo el audio de tus clips. En videos largos tarda unos segundos.</p><div class="bar"><i style="width:40%"></i></div>`);
  const map={};let fail=0,noVoice=0;
  for(const id of new Set(S.clips.map(c=>c.src))){try{const an=await analyze(sources[id]);const r=kind==='sil'?silences(an,S.sens):fillers(an,S.sens);if(r===null)noVoice++;else map[id]=r}catch(e){fail++}}

  if(kind==='sil'){

    commit(()=>{S.clips=nc;S.marks=[];selClip=Math.min(Math.max(0,selClip),S.clips.length-1)});

  }else{
    const marks=[];Object.keys(map).forEach(id=>map[id].forEach(([a,b])=>{if(srcToT(id,a)>=0)marks.push({id:uid(),src:id,a,b})}));

/* ---------- fotogramas clave (zoom) ---------- */
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function kfVal(c,src){const k=c.kf||[];if(!k.length)return{z:1,x:0,y:0};if(src<=k[0].s)return k[0];const L=k[k.length-1];if(src>=L.s)return L;
  for(let i=0;i<k.length-1;i++){const a=k[i],b=k[i+1];if(src>=a.s&&src<b.s){const u=ease((src-a.s)/(b.s-a.s||1));return{z:a.z+(b.z-a.z)*u,x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u}}}return L}

  const l=locate(curT);if(!l){toast('Importa un clip primero');return}const c=S.clips[l.i],v=kfVal(c,l.src),d=s=>Math.min(c.out,l.src+s*c.speed);
  commit(()=>{
    if(kind==='in'){setKf(c,l.src,v);setKf(c,d(0.6),{...v,z:Math.min(3,v.z*1.35)})}
    else if(kind==='punch'){setKf(c,l.src,v);setKf(c,d(0.12),{...v,z:Math.min(3,v.z*1.3)})}
    else{const st=v.z<1.05?{z:1.35,x:v.x,y:v.y}:v;setKf(c,l.src,st);setKf(c,d(0.6),{z:1,x:0,y:0})}
  });toast('Zoom agregado');

/* ---------- filtro automático ---------- */
function seekTo(v,t){return new Promise(r=>{if(Math.abs(v.currentTime-t)<0.01&&!v.seeking){r();return}let to;const done=()=>{clearTimeout(to);r()};v.addEventListener('seeked',done,{once:true});to=setTimeout(done,1500);v.currentTime=t})}

async function autoFilter(){
  stop();if(!S.clips.length||busy)return;busy=true;let f=null;

/* ---------- rendering ---------- */
function filterStr(){const f=S.filt;return`brightness(${f.b}%) contrast(${f.c}%) saturate(${f.s}%) sepia(${f.p}%) hue-rotate(${f.h}deg)`}

function draw(){
  const W=cv.width,H=cv.height,loc=locate(curT);

    ctx.filter='none';ctx.fillStyle=S.bg;ctx.fillRect(0,0,W,H);

      ctx.save();ctx.filter=filterStr()+(T.blur?` blur(${T.blur.toFixed(1)}px)`:'');

      if(c.mirror){ctx.translate(W,0);ctx.scale(-1,1)}
      drawFit(ctx,v,W,H,S.fit);ctx.restore();ctx.filter='none';
      if(T.flash>0){ctx.save();ctx.globalAlpha=T.flash;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.restore()}

  }else{ctx.filter='none';ctx.fillStyle=S.bg;ctx.fillRect(0,0,W,H)}

/* ---------- subtítulos: guion repartido sobre la voz detectada ---------- */
let subDraft=null,chunkMemo={w:null,max:0,c:[]};

      asr.forEach((x,k)=>{const mid=(x.a+x.b)/2;if(mid<c.in||mid>=c.out)return;
        const t0=st+(Math.max(x.a,c.in)-c.in)/c.speed,t1=st+(Math.min(x.b,c.out)-c.in)/c.speed;

function act(a,v){

  switch(a){

    case 'trimOut':{const l=locate(curT);if(!c||!l||l.i!==i){toast('Pon el cabezal sobre el clip elegido');return}if(l.src-c.in<0.1)return;commit(()=>{c.out=l.src});return}
    case 'dup':if(c)commit(()=>{S.clips.splice(i+1,0,cloneClip(c));selClip=i+1});return;
    case 'left':if(c&&i>0)commit(()=>{S.clips.splice(i,1);S.clips.splice(i-1,0,c);selClip=i-1;curT=cStart(i-1)});return;

    case 'mirrorAll':{const on=!S.clips.every(x=>x.mirror);commit(()=>S.clips.forEach(x=>x.mirror=on));toast(on?'Todos los clips en espejo':'Espejo quitado');return}

    case 'tin':case 'tout':{const t=S.texts.find(x=>x.id===selText);if(!t)return;commit(()=>{if(a==='tin')t.start=Math.min(curT,t.end-0.2);else t.end=Math.max(curT,t.start+0.2)});return}

      return}
    case 'subgen':{const txt=($('#subScript')||{}).value||'';if(!txt.trim()){toast('Pega primero tu guion');return}if(!S.clips.length){toast('Importa tus clips primero');return}genSubs(txt);return}
    case 'subdel':subDraft=null;commit(()=>{S.subs.script='';S.subs.words=[];S.subs.hash=''});return;

    h=`<div class="sec"><span class="lbl">Lienzo</span><div class="row">${Object.keys(AR).map(a=>chip('aspect',a,a,S.aspect===a)).join('')}</div></div>
      <div class="sec"><span class="lbl">Encuadre</span><div class="row">${chip('fit','cover','Llenar',S.fit==='cover')}${chip('fit','contain','Completo',S.fit==='contain')}<span style="width:8px"></span>${['#000000','#ffffff','#1d2a3a','#f2b544'].map(c=>`<button class="sw${S.bg===c?' on':''}" data-act="bg" data-v="${c}" style="background:${c}" aria-label="Fondo ${c}"></button>`).join('')}</div></div>
      <div class="sec"><span class="lbl">Calidad de exportación</span><div class="row">${chip('res',720,'720p',S.res===720)}${chip('res',1080,'1080p',S.res===1080)}</div></div>`;
  }
  panel.innerHTML=h;layoutSoon();
}
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.v)});
panel.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='subScript'){subDraft=el.value;return}
  if(el.id==='tInput'){const t=S.texts.find(x=>x.id===selText);if(!t)return;if(!el._h){push();el._h=true}t.text=el.value;renderTL();if(!playing)draw();return}
  const k=el.dataset.in;if(!k)return;if(!el._h){push();el._h=true}
  const v=+el.value,out=$('#out-'+k),t=S.texts.find(x=>x.id===selText);
  switch(k){
    case 'ow':{const o=curOv();if(!o)return;o.w=v;out.textContent=v+'%';break}
    case 'oop':{const o=curOv();if(!o)return;o.op=v;out.textContent=v+'%';break}
    case 'oin':{const o=curOv();if(!o)return;o.in=v;out.textContent=short(v);syncOv();break}
    case 'subsize':S.subs.size=v;out.textContent=v;break;
    case 'suby':S.subs.y=v;out.textContent=v+'%';break;
    case 'suboff':S.subs.offset=v;out.textContent=(v>0?'+':'')+v.toFixed(2)+'s';buildSubs();break;
    case 'tsize':t.size=v;out.textContent=v;break;
    case 'ty':t.y=v;out.textContent=v+'%';break;
    case 'origVol':S.origVol=v/100;out.textContent=v+'%';{const c=S.clips[activeIdx];if(playing&&c)setVol(sources[c.src].el,c.mute?0:S.origVol)}break;
    case 'musicVol':S.musicVol=v/100;out.textContent=v+'%';if(music)setVol(music.el,S.musicVol);break;
    case 'musicOffset':S.musicOffset=v;out.textContent=short(v);if(playing)syncMusic(true);break;
    case 'fb':S.filt.b=v;S.filt.name='';out.textContent=v;break;
    case 'fc':S.filt.c=v;S.filt.name='';out.textContent=v;break;
    case 'fs':S.filt.s=v;S.filt.name='';out.textContent=v;break;
    case 'kz':case 'kx':case 'ky':{const l=locate(curT);if(!l)return;const c=S.clips[l.i],cur=kfVal(c,l.src);const nv={z:cur.z,x:cur.x,y:cur.y};if(k==='kz'){nv.z=v/100;out.textContent=v+'%'}else{nv[k==='kx'?'x':'y']=v;out.textContent=v}setKf(c,l.src,nv);renderTL();break}
  }
  if(!playing)draw();
});
panel.addEventListener('change',e=>{e.target._h=false;if(['in-kz','in-kx','in-ky'].includes(e.target.id))renderPanel()});
function openTab(t,force){tab=(tab===t&&!force)?null:t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));renderPanel()}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)openTab(b.dataset.tab)});
$('#undoBtn').onclick=undo;

let lt=0;function layoutSoon(){cancelAnimationFrame(lt);lt=requestAnimationFrame(()=>{layout();renderTL();if(!playing)draw()})}
window.addEventListener('resize',layoutSoon);

function refresh(withPanel){
  curT=cl(curT,0,total());
  if(S.subs.script&&S.subs.hash!==clipHash())buildSubs();
  const has=S.clips.length>0;
  $('#empty').hidden=has;$('#exportBtn').disabled=!has;$('#splitBtn').disabled=!has;$('#autoBtn').disabled=!has;
  $('#durLbl').textContent=has?`${S.clips.length} clip${S.clips.length>1?'s':''} · ${short(total())}`:'sin clips';
  renderTL();if(withPanel)renderPanel();showFrame();updTime();
}

/* ---------- export ---------- */
let rec=null,chunks=[],recMime='',outURL='';
function pickMime(){if(!window.MediaRecorder)return null;const l=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'];for(const m of l){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return''}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="card">${html}</div>`;m.hidden=false}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#exportBtn').onclick=startExport;
function startExport(){
  if(!S.clips.length||exporting||busy)return;stop();
  const mime=pickMime();
  if(mime===null||!cv.captureStream){modal(`<h2>Exportar no está disponible</h2><p class="note">Este navegador no permite grabar video desde la página. Actualiza tu iPhone a la versión más reciente de iOS.</p><div class="row"><button class="btn" id="mClose">Cerrar</button></div>`);$('#mClose').onclick=closeModal;return}
  unlock();applyAudio();
  const stream=cv.captureStream(30);
  if(recDest)recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:S.res>=1080?9e6:5e6}:{})}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){toast('No pude iniciar la grabación');return}}
  recMime=rec.mimeType||mime||'video/mp4';chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=onRecStop;
  exporting=true;
  modal(`<h2>Exportando…</h2><p class="note">El video se graba en tiempo real (${short(total())}). Deja esta pantalla abierta y sin bloquear el teléfono.</p><div class="bar"><i id="expBar"></i></div><div class="row"><button class="btn" id="mCancel">Cancelar</button></div>`);
  $('#mCancel').onclick=()=>{exporting=false;rec._cancel=true;stop();try{rec.stop()}catch(e){}closeModal();toast('Exportación cancelada')};
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  curT=0;showFrame();
  setTimeout(()=>{if(!exporting)return;rec.start(250);play()},350);
}
function finishRec(){setTimeout(()=>{try{rec.stop()}catch(e){}},200)}
function onRecStop(){
  if(wake){wake.release().catch(()=>{});wake=null}
  if(rec._cancel){exporting=false;return}
  exporting=false;
  const blob=new Blob(chunks,{type:recMime.split(';')[0]});
  if(!blob.size){modal(`<h2>No se grabó nada</h2><p class="note">Intenta de nuevo con la pantalla encendida.</p><div class="row"><button class="btn" id="mClose">Cerrar</button></div>`);$('#mClose').onclick=closeModal;return}
  const ext=/mp4/.test(recMime)?'mp4':'webm';
  if(outURL)URL.revokeObjectURL(outURL);outURL=URL.createObjectURL(blob);
  const mb=(blob.size/1048576).toFixed(1);
  modal(`<h2>Tu video está listo</h2><video src="${outURL}" controls playsinline></video><p class="note">${ext.toUpperCase()} · ${cv.width}×${cv.height} · ${mb} MB${ext==='webm'?' · Este navegador solo graba WebM; en iPhone se exporta en MP4.':''}</p><p class="note" id="saveNote"></p><div class="row"><button class="btn" id="mClose">Cerrar</button><button class="btn primary" id="mSave">Guardar video</button></div>`);
  $('#mClose').onclick=closeModal;
  $('#mSave').onclick=()=>{
    const note=$('#saveNote'),name=`corte-${new Date().toISOString().slice(0,10)}.${ext}`;
    const dl=()=>{const a=document.createElement('a');a.href=outURL;a.download=name;document.body.appendChild(a);a.click();a.remove();note.textContent='Descargado. En iPhone lo encuentras en Archivos → Descargas.'};
    let file=null;try{file=new File([blob],name,{type:blob.type||'video/mp4'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(()=>{note.textContent='Listo. Si elegiste "Guardar video", ya está en Fotos.'})
        .catch(e=>{if(e&&e.name==='AbortError')note.textContent='Cancelaste el guardado.';else dl()});return}
    dl();
  };
}

/* ---------- toast ---------- */
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

setDims();refresh(false);draw();
})();
</script>

<div class="offl" id="offl" hidden></div>
<script>
/* modo sin internet: registra el service worker y muestra el avance de la descarga */
(function(){
  if(!('serviceWorker' in navigator))return;
  const el=document.getElementById('offl');let hideT=0;
  const show=(t,ms)=>{el.textContent=t;el.hidden=false;clearTimeout(hideT);if(ms)hideT=setTimeout(()=>el.hidden=true,ms)};
  const wasControlled=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};
    if(d.type==='progress'&&!wasControlled)show('Preparando modo sin internet… '+Math.round(d.p*100)+'%');
    else if(d.type==='ready')show(wasControlled?'Corte se actualizó':'Listo: Corte ya funciona sin internet',4000);
    else if(d.type==='failed'&&!wasControlled)show('No terminé de guardar la app. Ábrela otra vez con WiFi.',6000)});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}});
})();
</script>
